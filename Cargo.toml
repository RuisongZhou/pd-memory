[workspace]
resolver = "2"
members = [
  "crates/pd-memory-core",
  "crates/pd-memory-llm",
  "crates/pd-memory-mcp",
  "crates/pd-memory-hooks",
  "crates/pd-memory-cli",
  "crates/pd-memory-ffi",
  "crates/pd-memory-testkit",
  "crates/pd-memory-sqlite",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"
authors = ["PilotDeck Memory SDK contributors"]
repository = "https://github.com/RuisongZhou/pd-memory"

[workspace.dependencies]
pd-memory-core = { path = "crates/pd-memory-core" }
pd-memory-llm = { path = "crates/pd-memory-llm" }
pd-memory-mcp = { path = "crates/pd-memory-mcp" }
pd-memory-hooks = { path = "crates/pd-memory-hooks" }
pd-memory-cli = { path = "crates/pd-memory-cli" }
pd-memory-testkit = { path = "crates/pd-memory-testkit" }
pd-memory-sqlite = { path = "crates/pd-memory-sqlite" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
env_logger = "0.11"
ureq = { version = "3", features = ["json", "rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
jni = "0.21"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
